
workflows:
  techpro-android:
    name: TechPro - Android APK
    max_build_duration: 60

    environment:
      node: 22
      java: 21

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true

    scripts:
      - name: Installer les dependances
        script: |
          npm install
          npm install --save-dev @capacitor/assets

      - name: Preparer les icones TechPro
        script: |
          mkdir -p assets
          cp icon-512.png assets/icon.png

      - name: Compiler TechPro Web
        script: |
          npm run build

      - name: Creer le projet Android si absent
        script: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Generer les icones Android
        script: |
          npx capacitor-assets generate --android

      - name: Synchroniser Capacitor
        script: |
          npx cap sync android

      - name: Configurer Android SDK
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties

      - name: Configurer les liens Android TechPro
        script: |
          node patch-android-manifest.mjs

      - name: Verifier le manifeste Android
        script: |
          grep -q 'techpro.phenixconnect.online' android/app/src/main/AndroidManifest.xml
          grep -q 'android:autoVerify="true"' android/app/src/main/AndroidManifest.xml
          echo "Configuration App Links TechPro verifiee."

      - name: Generer APK Android
        script: |
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

    artifacts:
      - android/app/build/outputs/apk/debug/*.apk
