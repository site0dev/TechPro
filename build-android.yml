name: Build TechPro Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'index.html'
      - 'manifest.json'
      - 'sw.js'
      - '192.png'
      - 'icon-512.png'
      - 'package.json'
      - 'capacitor.config.ts'
      - 'vite.config.ts'
      - 'src/**'
      - 'scripts/**'
      - '.github/workflows/build-android.yml'

permissions:
  contents: read

env:
  CI: true

jobs:
  build:
    name: Compile APK Android
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Installer Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Installer les dépendances du projet
        run: npm install --no-audit --no-fund

      - name: Construire les fichiers Web
        run: npm run build

      - name: Générer la plateforme Android si elle n'existe pas
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Synchroniser Capacitor
        run: npx cap sync android

      - name: Configurer le lien de retour Supabase Auth
        run: node scripts/patch-android-manifest.mjs

      - name: Compiler l'APK debug
        run: |
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Publier l'APK téléchargeable
        uses: actions/upload-artifact@v4
        with:
          name: TechPro-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
